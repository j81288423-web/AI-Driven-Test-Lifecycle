name: Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Enable once validated. `closed` also fires on PRs closed without merging,
  # so the job-level `if:` below is required.
  # pull_request:
  #   types: [closed]
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: [self-hosted, windows]
    timeout-minutes: 60

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4.1.0
        with:
          clean: true
          fetch-depth: 1

      - name: Seed .env from committed template
        shell: powershell
        run: Copy-Item .env.example .env -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify toolchain
        shell: powershell
        run: |
          Write-Host "Runner   : $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Install Playwright Chromium
        shell: powershell
        run: npx playwright install chromium

      - name: Run regression batch file
        shell: cmd
        run: run-tests.bat

      - name: Upload results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4.1.0
        with:
          name: cucumber-results
          path: |
            Reports/dashboard-report.html
            test-results/json/*.json
            test-results/screenshots/**
          retention-days: 30
          if-no-files-found: warn

      - name: Publish report links to run summary
        if: always()
        shell: powershell
        run: |
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          "## Regression report" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Download page: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Artifact id: ${{ steps.upload.outputs.artifact-id }}" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Artifact API: $api" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Direct download: ${{ steps.upload.outputs.artifact-url }}" | Out-File -Append $env:GITHUB_STEP_SUMMARY

  publish-report:
    needs: run-regression
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write
      actions: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: cucumber-results
          path: artifact

      - name: Build site with stable filenames
        shell: bash
        run: |
          mkdir -p site
          cp artifact/Reports/dashboard-report.html site/index.html
          cp artifact/Reports/dashboard-report.html site/dashboard-report.html
          if [ -d artifact/test-results/json ]; then
            cp -r artifact/test-results/json site/json
          fi

      - name: Delete stale github-pages artifacts for this run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id, per_page: 100 }
            );

            const stale = artifacts.filter((artifact) => artifact.name === "github-pages");
            core.info(`Found ${stale.length} existing github-pages artifact(s) in this run.`);

            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted stale github-pages artifact ${artifact.id}`);
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
