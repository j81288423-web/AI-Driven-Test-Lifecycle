name: Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Enable once validated. `closed` also fires on PRs closed without merging,
  # so the job-level `if:` below is required.
  # pull_request:
  #   types: [closed]
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  group: regression-tests
  cancel-in-progress: false

jobs:
  run-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4.1.0
        with:
          clean: true
          fetch-depth: 1

      - name: Verify toolchain
        shell: powershell
        run: |
          Write-Host "Runner   : $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Install Playwright Chromium
        shell: powershell
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        shell: powershell
        run: npm run test:cucumber:report -- --tags @regression

      # always() so results are captured when tests fail, which is when they matter most.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4.1.0
        with:
          name: cucumber-results
          path: |
            test-results/cucumber-report.html
            test-results/screenshots/**
          retention-days: 30
          if-no-files-found: warn
